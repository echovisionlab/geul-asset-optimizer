services:
  geul-asset-optimizer-prod:
    image: ${GEUL_ASSET_OPTIMIZER_IMAGE:?set GEUL_ASSET_OPTIMIZER_IMAGE to a full image reference}
    container_name: geul-asset-optimizer-prod
    networks:
      default: {}
      runtime: {}
    environment:
      PORT: ${GEUL_ASSET_OPTIMIZER_PORT:?set GEUL_ASSET_OPTIMIZER_PORT in the runtime environment}
      LOG_LEVEL: ${GEUL_ASSET_OPTIMIZER_LOG_LEVEL:?set GEUL_ASSET_OPTIMIZER_LOG_LEVEL in the runtime environment}
      DATABASE_DSN: ${GEUL_ASSET_OPTIMIZER_DATABASE_DSN:?set GEUL_ASSET_OPTIMIZER_DATABASE_DSN in the runtime environment}
      S3_ENDPOINT: ${GEUL_ASSET_OPTIMIZER_S3_ENDPOINT:?set GEUL_ASSET_OPTIMIZER_S3_ENDPOINT in the runtime environment}
      S3_MEDIA_BUCKET: ${GEUL_S3_MEDIA_BUCKET:?set GEUL_S3_MEDIA_BUCKET in the runtime environment}
      S3_REGION: ${GEUL_S3_REGION:?set GEUL_S3_REGION in the runtime environment}
      S3_ACCESS_KEY_ID: ${GEUL_ASSET_OPTIMIZER_S3_ACCESS_KEY_ID:?set GEUL_ASSET_OPTIMIZER_S3_ACCESS_KEY_ID in the runtime environment}
      S3_SECRET_ACCESS_KEY: ${GEUL_ASSET_OPTIMIZER_S3_SECRET_ACCESS_KEY:?set GEUL_ASSET_OPTIMIZER_S3_SECRET_ACCESS_KEY in the runtime environment}
      S3_FORCE_PATH_STYLE: ${GEUL_S3_FORCE_PATH_STYLE:?set GEUL_S3_FORCE_PATH_STYLE in the runtime environment}
      ASSET_OPTIMIZER_TEMP_DIR: ${GEUL_ASSET_OPTIMIZER_TEMP_DIR:?set GEUL_ASSET_OPTIMIZER_TEMP_DIR in the runtime environment}
      MAX_INPUT_BYTES: ${GEUL_ASSET_OPTIMIZER_MAX_INPUT_BYTES:?set GEUL_ASSET_OPTIMIZER_MAX_INPUT_BYTES in the runtime environment}
      WORKER_COUNT: ${GEUL_ASSET_OPTIMIZER_WORKER_COUNT:?set GEUL_ASSET_OPTIMIZER_WORKER_COUNT in the runtime environment}
      JOB_TIMEOUT_MINUTES: ${GEUL_ASSET_OPTIMIZER_JOB_TIMEOUT:?set GEUL_ASSET_OPTIMIZER_JOB_TIMEOUT in the runtime environment}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${GEUL_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${GEUL_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${GEUL_OTEL_RESOURCE_ATTRIBUTES:-service.namespace=geul,deployment.environment=production}
    restart: unless-stopped

networks:
  runtime:
    name: ${GEUL_ASSET_OPTIMIZER_RUNTIME_NETWORK_NAME:?set GEUL_ASSET_OPTIMIZER_RUNTIME_NETWORK_NAME in the runtime environment}
    external: true
