name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.dsub.io
  ASSET_OPTIMIZER_IMAGE: registry.dsub.io/echovisionlab/geul-asset-optimizer
  PLATFORMS: linux/amd64

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate Release Please outputs
        id: release
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "Release Please did not return tag_name" >&2
            exit 1
          fi
          if [ -z "${RELEASE_VERSION}" ]; then
            echo "Release Please did not return version" >&2
            exit 1
          fi
          if ! [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Release Please returned a non-full commit SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "v${RELEASE_VERSION}" ]; then
            echo "Release Please tag_name ${RELEASE_TAG} does not match version ${RELEASE_VERSION}" >&2
            exit 1
          fi
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "sha=${RELEASE_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release checkout
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${checkout_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release tag ${RELEASE_TAG} resolved to ${checkout_sha}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Validate credentials
        env:
          HARBOR_REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_REGISTRY_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in HARBOR_REGISTRY_USERNAME HARBOR_REGISTRY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing repository secret: ${var}" >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Collect image metadata
        id: image
        env:
          CREATED_AT: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CREATED_AT}" ]; then
            CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          echo "created_at=${CREATED_AT}" >> "${GITHUB_OUTPUT}"

      - name: Build and push release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          cache-from: type=gha,scope=geul-asset-optimizer-release
          cache-to: type=gha,scope=geul-asset-optimizer-release,mode=max,ignore-error=true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created_at }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.release.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-asset-optimizer
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.ASSET_OPTIMIZER_IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.ASSET_OPTIMIZER_IMAGE }}:sha-${{ steps.release.outputs.sha }}

      - name: Verify immutable release image and smoke digest
        env:
          SHA_IMAGE: ${{ env.ASSET_OPTIMIZER_IMAGE }}:sha-${{ steps.release.outputs.sha }}
          VERSION_IMAGE: ${{ env.ASSET_OPTIMIZER_IMAGE }}:${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker pull "${SHA_IMAGE}"
          sha_digest="$(docker buildx imagetools inspect "${SHA_IMAGE}" --format '{{.Manifest.Digest}}')"
          version_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" --format '{{.Manifest.Digest}}')"
          if ! [[ "${sha_digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || [ "${version_digest}" != "${sha_digest}" ]; then
            echo "Release and SHA tags do not identify one immutable image digest." >&2
            exit 1
          fi
          docker pull "${ASSET_OPTIMIZER_IMAGE}@${sha_digest}"
          docker run --rm "${ASSET_OPTIMIZER_IMAGE}@${sha_digest}" /bin/sh -c 'test -x /app/service && gltf-transform --version && node /app/scripts/optimize-particle-mesh.mjs --help'
