name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  STATICCHECK_VERSION: v0.7.0
  DEADCODE_VERSION: v0.48.0

jobs:
  format:
    name: Format
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

  go:
    name: Go
    needs: format
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}" .github/workflows/*.yml

      - name: Download Go modules
        run: go mod download

      - name: Tidy Go module
        run: go mod tidy

      - name: Check Go module files
        run: git diff --exit-code -- go.mod go.sum

      - name: Run Go tests with coverage
        run: go test -covermode=atomic -coverprofile="${RUNNER_TEMP}/coverage.out" ./...

      - name: Enforce Go coverage
        run: |
          go tool cover -func="${RUNNER_TEMP}/coverage.out"
          total="$(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ { print $3 }')"
          if [ "${total}" != "100.0%" ]; then
            echo "expected 100.0% statement coverage, got ${total}" >&2
            exit 1
          fi
          if awk 'NR > 1 && $3 == 0 { print; uncovered = 1 } END { exit uncovered ? 0 : 1 }' "${RUNNER_TEMP}/coverage.out"; then
            echo "coverage profile contains uncovered handwritten statements" >&2
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...

      - name: Reject nested if statements
        run: go run ./scripts/ci/no-nested-if.go .

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Run test-specific golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --config .golangci-tests.yml ./...

      - name: Detect dead code
        run: go run "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}" ./...

      - name: Build asset optimizer
        run: go build ./cmd/asset-optimizer

  runtime-assets:
    name: Validate Runtime Assets
    needs: format
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Check YAML
        run: npm run check:yaml

      - name: Check Compose configuration
        run: npm run check:compose

  validate:
    name: Validate
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--') }}
    needs: [format, go, runtime-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          GO_RESULT: ${{ needs.go.result }}
          RUNTIME_RESULT: ${{ needs.runtime-assets.result }}
        run: |
          test "${FORMAT_RESULT}" = success
          test "${GO_RESULT}" = success
          test "${RUNTIME_RESULT}" = success
